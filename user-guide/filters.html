<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>pgn-extract Documentation</title>
  <link rel="stylesheet" href="user_guide_style.css" />
</head>
<body>
  <div class="search-bar-container">
    <input type="text" id="searchInput" placeholder="Search...." class="search-bar" />
    <button onclick="runSearch()" class="search-go">Go</button>
  </div>

  <div class="layout">
    <!-- Sidebar -->
    <nav id="nav"></nav>
    <script src="nav.js"></script>

    <!-- Reopen Sidebar Button -->
    <button class="reopen-btn" onclick="toggleSidebar()" id="reopenBtn">☰</button>

    <!-- Main Content -->
    <main class="main" id="main">
      <h1 class="doc-title">Filter Commands</h1>
      <hr class="sidebar-divider" />

      <h2>Higher rated winner</h2>
      <p>Filters games that are won by the higher elo player.</p>
      <p>Command line example:</p>
      <div class="code-block"><pre><code> pgn-extract --higherratedwinner example.pgn</code></pre></div>
      <p>Output:</p>
      <div class="code-block"><pre><code> </code></pre></div>

    </main>
  </div>





  <!-- JavaScript -->
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const main = document.getElementById("main");
      const reopenBtn = document.getElementById("reopenBtn");

      sidebar.classList.toggle("hidden");
      main.classList.toggle("full");

      if (sidebar.classList.contains("hidden")) {
        reopenBtn.style.display = "block";
      } else {
        reopenBtn.style.display = "none";
      }
    }

    function toggleSection(el) {
      const links = el.nextElementSibling;
      links.classList.toggle("show");
      el.innerHTML = el.innerHTML.includes("▸")
        ? el.innerHTML.replace("▸", "▾")
        : el.innerHTML.replace("▾", "▸");
    }

    function toggleDarkMode() {
      const dark = document.getElementById("darkToggle").checked;
      document.body.classList.toggle("dark", dark);
      localStorage.setItem("darkMode", dark);
    }

    window.onload = () => {
      if (localStorage.getItem("darkMode") === "true") {
        document.body.classList.add("dark");
        document.getElementById("darkToggle").checked = true;
      }
    };

    function runSearch() {
  const query = document.getElementById("searchInput").value.trim().toLowerCase();
  const sections = document.querySelectorAll("main section");

  sections.forEach(section => {
    // Remove previous highlights
    removeHighlights(section);

    const textContent = section.innerText.toLowerCase();

    if (query === "") {
      section.style.display = "block";
    } else if (textContent.includes(query)) {
      section.style.display = "block";
      highlightMatches(section, query);
    } else {
      section.style.display = "none";
    }
  });
}

function highlightMatches(container, query) {
  const regex = new RegExp(`(${query})`, "gi");

  container.querySelectorAll("*").forEach(node => {
    if (node.children.length === 0 && node.textContent.trim()) {
      node.innerHTML = node.textContent.replace(regex, '<span class="highlighted">$1</span>');
    }
  });
}

function removeHighlights(container) {
  container.querySelectorAll("span.highlighted").forEach(span => {
    span.outerHTML = span.innerText;
  });
}

  

  // Optional: Press Enter to search
  document.getElementById("searchInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      runSearch();
    }
  });
  </script>
</body>
</html>
